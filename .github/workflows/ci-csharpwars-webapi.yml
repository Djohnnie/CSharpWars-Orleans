name: CI - CSharpWars.WebApi

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-publish:
    name: Build, Test & Push CSharpWars.WebApi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CSharpWars/CSharpWars.Frontend/CSharpWars.slnx

      - name: Build
        run: dotnet build CSharpWars/CSharpWars.Frontend/CSharpWars.slnx -c Release --no-restore

      - name: Test
        run: dotnet test CSharpWars/CSharpWars.Frontend/CSharpWars.slnx -c Release --no-build --verbosity normal

      - name: Determine build version
        id: version
        run: |
          DATE=$(date +'%Y.%m.%d')
          REVISION=${{ github.run_number }}
          VERSION="${DATE}-${REVISION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Build version: ${VERSION}"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./CSharpWars
          file: ./CSharpWars/CSharpWars.WebApi.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/csharpwars.webapi:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_REGISTRY }}/csharpwars.webapi:latest
