name: CD - CSharpWars.Orleans.Host

on:
  workflow_run:
    workflows: [ "CI - CSharpWars.Orleans.Host" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy:
    name: Deploy CSharpWars.Orleans.Host to Azure Container Apps
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.ACA_NAME_ORLEANS_HOST }}
          imageToDeploy: ${{ secrets.DOCKER_REGISTRY }}/csharpwars.orleans.host:latest
