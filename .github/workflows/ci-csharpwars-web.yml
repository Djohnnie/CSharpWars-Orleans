name: CI - CSharpWars.Web

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-publish:
    name: Build, Test & Push CSharpWars.Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: CSharpWars/CSharpWars.Frontend/Library
          key: unity-library-${{ runner.os }}-webgl-${{ hashFiles('CSharpWars/CSharpWars.Frontend/Packages/packages-lock.json', 'CSharpWars/CSharpWars.Frontend/ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            unity-library-${{ runner.os }}-webgl-${{ hashFiles('CSharpWars/CSharpWars.Frontend/Packages/packages-lock.json', 'CSharpWars/CSharpWars.Frontend/ProjectSettings/ProjectVersion.txt') }}-
            unity-library-${{ runner.os }}-webgl-

      - name: Build Unity WebGL frontend
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: CSharpWars/CSharpWars.Frontend
          targetPlatform: WebGL
          buildsPath: build
          buildName: bin
          versioning: None

      - name: Stage Unity WebGL frontend
        shell: bash
        run: |
          UNITY_BUILD="build/WebGL/bin"
          UNITY_WEB="CSharpWars/CSharpWars.Web/wwwroot/lib/unity"

          test -d "${UNITY_BUILD}/Build"
          rm -rf "${UNITY_WEB}"
          mkdir -p "${UNITY_WEB}"
          cp -a "${UNITY_BUILD}/Build/." "${UNITY_WEB}/"

          if [ -d "${UNITY_BUILD}/StreamingAssets" ]; then
            cp -a "${UNITY_BUILD}/StreamingAssets" "${UNITY_WEB}/"
          fi

          test -f "${UNITY_WEB}/bin.loader.js"
          test -f "${UNITY_WEB}/bin.data.gz"
          test -f "${UNITY_WEB}/bin.framework.js.gz"
          test -f "${UNITY_WEB}/bin.wasm.gz"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CSharpWars/CSharpWars.slnx

      - name: Build
        run: dotnet build CSharpWars/CSharpWars.slnx -c Release --no-restore

      - name: Test
        run: dotnet test CSharpWars/CSharpWars.slnx -c Release --no-build --verbosity normal

      - name: Determine build version
        id: version
        run: |
          DATE=$(date +'%Y.%m.%d')
          # Count how many times this workflow has run today by using the run number
          # Use GitHub run number scoped to the date as the revision
          REVISION=${{ github.run_number }}
          VERSION="${DATE}-${REVISION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Build version: ${VERSION}"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./CSharpWars
          file: ./CSharpWars/CSharpWars.Web.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/csharpwars.web:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_REGISTRY }}/csharpwars.web:latest
