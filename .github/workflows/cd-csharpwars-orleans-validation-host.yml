name: CD - CSharpWars.Orleans.Validation.Host

on:
  workflow_run:
    workflows: [ "CI - CSharpWars.Orleans.Validation.Host" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy:
    name: Deploy CSharpWars.Orleans.Validation.Host to Azure Container Apps
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Determine build version
        id: version
        run: |
          DATE=$(date -d "${{ github.event.workflow_run.created_at }}" +'%Y.%m.%d')
          REVISION=${{ github.event.workflow_run.run_number }}
          echo "version=${DATE}-${REVISION}" >> $GITHUB_OUTPUT

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.ACA_NAME_ORLEANS_VALIDATION_HOST }}
          imageToDeploy: ${{ secrets.DOCKER_REGISTRY }}/csharpwars.orleans.validation.host:${{ steps.version.outputs.version }}
